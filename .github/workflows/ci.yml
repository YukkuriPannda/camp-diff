name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run compile
      - run: npm run build
      - name: Unit tests (headless VS Code)
        run: xvfb-run -a npm test
      - name: Packaging check
        run: xvfb-run -a npm run test:package

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Presence relay integration test (real WebSocket over loopback)
        run: xvfb-run -a npm run test:integration
